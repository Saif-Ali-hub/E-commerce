<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="nxBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nxStroke" x1="10" y1="10" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="nxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Badge Squircle -->
  <rect width="36" height="36" rx="10" fill="url(#nxBg)"/>
  <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="9.25" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.5"/>

  <!-- Futuristic Nexus N -->
  <path d="M11.5 25V11L24.5 25V11" stroke="url(#nxStroke)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#nxGlow)"/>

  <!-- Glowing Nexus Node at Top-Right Terminal -->
  <circle cx="24.5" cy="11" r="2.2" fill="#38bdf8"/>
  <circle cx="24.5" cy="11" r="1.1" fill="#ffffff"/>
</svg>
